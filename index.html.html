<title>Productive Muslim</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600;700&family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --teal:#00d4b8;--teal2:#00f5d4;--tdim:rgba(0,212,184,0.1);--tdim2:rgba(0,212,184,0.06);
  --blue:#4facfe;--bdim:rgba(79,172,254,0.1);
  --purple:#a78bfa;--pdim:rgba(167,139,250,0.1);
  --amber:#f59e0b;--adim:rgba(245,158,11,0.1);
  --rose:#f43f5e;--rdim:rgba(244,63,94,0.1);
  --bg:#050d14;--bg2:#080f18;--bg3:#0c1520;
  --card:rgba(8,18,28,0.97);--bdr:rgba(0,212,184,0.1);--bdr2:rgba(0,212,184,0.22);
  --tx:#e2eff0;--tx2:#7fa8b0;--tx3:#3a5a62;
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:Inter,sans-serif;font-size:16px}
::-webkit-scrollbar{display:none}
button{border:none;cursor:pointer;font-family:Inter,sans-serif;font-size:16px}
button:active{opacity:0.75;transform:scale(0.97)}
input,textarea{font-family:Inter,sans-serif;font-size:16px;-webkit-appearance:none}
.cinzel{font-family:Cinzel,serif}
.arabic{font-family:'Scheherazade New',serif;direction:rtl;text-align:right}

/* Animations */
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
@keyframes shimmer{0%{background-position:-300% 0}100%{background-position:300% 0}}
@keyframes glow{0%,100%{box-shadow:0 0 15px rgba(0,212,184,0.1)}50%{box-shadow:0 0 30px rgba(0,212,184,0.25)}}
.au{animation:fadeUp 0.35s ease both}
.au2{animation:fadeUp 0.35s 0.07s ease both}
.au3{animation:fadeUp 0.35s 0.14s ease both}

/* Layout */
#root{display:flex;flex-direction:column;height:100vh}
.page{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:88px}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 120% 60% at 50% -10%,rgba(0,212,184,0.06),transparent 55%),radial-gradient(ellipse 80% 80% at 95% 95%,rgba(79,172,254,0.05),transparent);pointer-events:none;z-index:0}
#root>*{position:relative;z-index:1}

/* Top Nav */
.topnav{padding:max(env(safe-area-inset-top,0px),18px) 18px 12px;background:linear-gradient(180deg,var(--bg) 70%,transparent);position:sticky;top:0;z-index:50;backdrop-filter:blur(10px)}

/* Tab Bar */
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:100;display:flex;background:rgba(5,13,20,0.97);border-top:1px solid rgba(0,212,184,0.1);padding-bottom:env(safe-area-inset-bottom,0);backdrop-filter:blur(20px)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:9px 2px;border:none;background:none;position:relative;cursor:pointer}
.tab::after{content:'';position:absolute;top:0;left:20%;right:20%;height:2px;background:linear-gradient(90deg,transparent,var(--teal),transparent);border-radius:0 0 2px 2px;opacity:0;transition:opacity 0.25s}
.tab.on::after{opacity:1}
.tab-i{font-size:20px;line-height:1;margin-bottom:3px;transition:transform 0.2s}
.tab.on .tab-i{transform:scale(1.15)}
.tab-l{font-size:9px;font-weight:600;color:var(--tx3);transition:color 0.2s;letter-spacing:0.3px}

// ── SCHEDULE TAB ──────────────────────────────────────────────────────────────
function renderSchedule(pg){
  const checks=ls('checks_'+today(),{});

  pg.appendChild(dv('topnav au',[
    dv(null,[
      pt('cinzel','Productive Muslim',{style:{fontSize:20,fontWeight:700,background:'linear-gradient(135deg,#00d4b8,#4facfe)',WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent'}}),
      pt(null,"Today's Power Schedule",{style:{fontSize:12,color:'var(--tx3)',marginTop:2}}),
    ]),
    dv(null,[
      pt(null,Object.values(checks).filter(Boolean).length+'',{style:{fontFamily:'Cinzel,serif',fontSize:22,fontWeight:700,color:'var(--teal)',textAlign:'right'}}),
      pt(null,'done',{style:{fontSize:9,color:'var(--tx3)',textAlign:'right'}}),
    ]),
  ],{style:{display:'flex',alignItems:'center',justifyContent:'space-between'}}));

  // Progress bar
  const total=SCHEDULE.reduce((a,b)=>a+b.items.length,0);
  const done=Object.values(checks).filter(Boolean).length;
  const pc=dv('au2',null,{style:{margin:'0 16px 14px'}});
  pc.appendChild(dv(null,[
    sp(null,done+' of '+total+' tasks',{style:{fontSize:11,color:'var(--teal)',fontWeight:600}}),
    sp(null,' · '+Math.round(done/total*100)+'%',{style:{fontSize:11,color:'var(--tx3)'}}),
  ],{style:{marginBottom:7}}));
  pc.appendChild(dv('pbar',dv('pbar-f',null,{style:{width:(done/total*100)+'%'}})));
  pg.appendChild(pc);

  SCHEDULE.forEach(block=>{
    let open=false;
    const body=dv('sched-body');

    // Warning
    if(block.warning){
      const w=dv('sched-warning');w.textContent=block.warning;
      body.appendChild(w);
    }

    // Checklist
    const checksDone=block.items.filter((_,i)=>checks[block.label+'_'+i]).length;
    const prog=pt('sched-prog',checksDone+'/'+block.items.length+' completed');
    body.appendChild(prog);

    block.items.forEach((item,i)=>{
      const key=block.label+'_'+i;
      const isDone=!!checks[key];
      const txt=typeof item==='object'?(item.job||item.biz||Object.values(item)[0]):item;
      const row=dv('check-row');
      const box=dv('check-box'+(isDone?' done':''));
      const lbl=pt('check-label'+(isDone?' done':''),txt);
      row.appendChild(box);row.appendChild(lbl);
      row.addEventListener('click',()=>{
        const cur=ls('checks_'+today(),{});
        cur[key]=!cur[key];
        lss('checks_'+today(),cur);
        box.className='check-box'+(cur[key]?' done':'');
        lbl.className='check-label'+(cur[key]?' done':'');
        const d2=Object.values(ls('checks_'+today(),{})).filter(Boolean).length;
        prog.textContent=block.items.filter((_,j)=>ls('checks_'+today(),{})[block.label+'_'+j]).length+'/'+block.items.length+' completed';
      });
      body.appendChild(row);
    });

    const arr=sp('sched-arr','▼');
    const accent=dv('sched-hdr-accent',null,{style:{background:block.accent,minHeight:'40px'}});
    const info=dv(null,[
      pt('sched-time',block.time),
      pt('sched-label',block.label),
    ]);
    const hdr=dv('sched-hdr',[accent,sp('sched-icon',block.icon),info,arr],{
      onclick:()=>{
        open=!open;body.classList.toggle('open',open);arr.style.transform=open?'rotate(180deg)':'none';
      }
    });
    hdr.style.background='rgba(8,22,35,0.95)';

    const wrap=dv('sched-block au2');
    wrap.style.background='rgba(8,22,35,0.95)';
    wrap.appendChild(hdr);wrap.appendChild(body);
    pg.appendChild(wrap);
  });
}

    const ar=pt('dhikr-ar');ar.textContent=d.ar;card.appendChild(ar);
    card.appendChild(pt(null,d.tr,{style:{fontSize:13,color:'var(--tx3)',fontStyle:'italic',padding:'0 18px 8px'}}));
    card.appendChild(pt(null,'✨ '+d.benefit,{style:{fontSize:12,color:'var(--teal)',padding:'0 18px 12px',opacity:0.7}}));

    const cntEl=pt('dhikr-count',String(count));
    const tgtEl=pt('dhikr-target','Target: '+d.target);
    const bar=dv('pbar',dv('pbar-f',null,{style:{width:Math.min(count/d.target*100,100)+'%'}}),{style:{margin:'0 18px 10px',height:4}});

    const btnEl=bt('dhikr-btn','+');
    btnEl.addEventListener('click',()=>{
      const c2=ls('dhikr_'+today(),{});
      c2[d.name]=(c2[d.name]||0)+1;
      lss('dhikr_'+today(),c2);
      cntEl.textContent=String(c2[d.name]);
      bar.firstChild.style.width=Math.min(c2[d.name]/d.target*100,100)+'%';
      if(c2[d.name]===d.target){
        btnEl.style.background='linear-gradient(135deg,#f59e0b,#fcd34d)';
        cntEl.style.color='#f59e0b';
      }
    });

    const ctrRow=dv('dhikr-counter',[
      dv(null,[cntEl,tgtEl]),btnEl
    ]);
    card.appendChild(ctrRow);
    card.appendChild(bar);

    const rst=pt('dhikr-reset','↺ Reset today');
    rst.addEventListener('click',()=>{
      const c2=ls('dhikr_'+today(),{});
      c2[d.name]=0;lss('dhikr_'+today(),c2);
      cntEl.textContent='0';
      bar.firstChild.style.width='0%';
      btnEl.style.background='linear-gradient(135deg,var(--teal),var(--teal2))';
      cntEl.style.color='var(--teal)';
    });
    card.appendChild(rst);
    pg.appendChild(card);
  });
}

// ── STREAKS TAB ───────────────────────────────────────────────────────────────
function renderStreaks(pg){
  pg.appendChild(dv('topnav au',[
    pt('cinzel','Streaks & Habits',{style:{fontSize:20,fontWeight:700,color:'var(--teal)'}}),
    pt(null,'Track your consistency',{style:{fontSize:11,color:'var(--tx3)',marginTop:2}}),
  ]));

  // Overall stats
  const allStreaks=STREAK_CATS.map(c=>{
    let streak=0,d=new Date();
    while(true){
      const k=d.toISOString().split('T')[0];
      if(!ls('streak_'+k,{})[c.id])break;
      streak++;d.setDate(d.getDate()-1);
    }
    return{...c,streak};
  });
  const best=Math.max(...allStreaks.map(s=>s.streak));
  const totalToday=allStreaks.filter(s=>ls('streak_'+today(),{})[s.id]).length;

  const statsCard=dv('card-g au',null,{style:{margin:'0 16px 16px',padding:'18px'}});
  statsCard.appendChild(dv(null,[
    dv(null,[
      pt('cinzel',String(totalToday),{style:{fontSize:28,fontWeight:700,color:'var(--teal)',marginBottom:2}}),
      pt(null,'Today',{style:{fontSize:11,color:'var(--tx3)'}}),
    ]),
    dv(null,[
      pt('cinzel',String(best),{style:{fontSize:28,fontWeight:700,color:'var(--blue)',marginBottom:2,textAlign:'right'}}),
      pt(null,'Best streak',{style:{fontSize:11,color:'var(--tx3)',textAlign:'right'}}),
    ]),
  ],{style:{display:'flex',justifyContent:'space-between',marginBottom:12}}));
  statsCard.appendChild(dv('pbar',dv('pbar-f',null,{style:{width:(totalToday/STREAK_CATS.length*100)+'%'}})));
  pg.appendChild(statsCard);

  const grid=dv('streak-grid au2');
  allStreaks.forEach(cat=>{
    const card=dv('streak-card');
    card.appendChild(pt(null,cat.icon+' '+cat.label,{style:{fontSize:13,fontWeight:600,color:'var(--tx2)',marginBottom:10}}));
    const num=pt('streak-num',String(cat.streak));
    card.appendChild(num);
    card.appendChild(pt(null,'day streak',{style:{fontSize:11,color:'var(--tx3)',marginTop:3}}));

    // Last 7 dots
    const dots=dv('streak-dots');
    for(let i=6;i>=0;i--){
      const d=new Date();d.setDate(d.getDate()-i);
      const k=d.toISOString().split('T')[0];
      const done=!!ls('streak_'+k,{})[cat.id];
      dots.appendChild(dv('sdot'+(done?' done':'')));
    }
    card.appendChild(dots);

    const isTodayDone=!!ls('streak_'+today(),{})[cat.id];
    const tapBtn=bt('streak-tap',isTodayDone?'✓ Done Today':'Mark Today ✓');
    if(isTodayDone)tapBtn.style.color='var(--teal)';
    tapBtn.addEventListener('click',()=>{
      const cur=ls('streak_'+today(),{});
      cur[cat.id]=!cur[cat.id];
      lss('streak_'+today(),cur);
      tapBtn.textContent=cur[cat.id]?'✓ Done Today':'Mark Today ✓';
      tapBtn.style.color=cur[cat.id]?'var(--teal)':'var(--tx2)';
      // Recalculate streak dot
      dots.lastChild.className='sdot'+(cur[cat.id]?' done':'');
      let streak2=0;const d2=new Date();
      while(true){
        const k=d2.toISOString().split('T')[0];
        if(!ls('streak_'+k,{})[cat.id])break;
        streak2++;d2.setDate(d2.getDate()-1);
      }
      num.textContent=String(streak2);
    });
    card.appendChild(tapBtn);
    grid.appendChild(card);
  });
  pg.appendChild(grid);

  // Footer
  pg.appendChild(dv('footer',[
    pt(null,'بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ',{style:{fontFamily:'"Scheherazade New",serif',fontSize:16,color:'rgba(0,212,184,0.25)',direction:'rtl',marginBottom:5}}),
    pt(null,'Designed with love by Ajumal 🤍'),
    pt(null,'May Allah make us the best version of ourselves. Ameen.'),
  ]));
}

// ── TABS ──────────────────────────────────────────────────────────────────────
const TABS=[
  {k:'schedule',l:'Schedule',e:'📋'},
  {k:'duas',l:'Duas',e:'🤲'},
  {k:'dhikr',l:'Dhikr',e:'📿'},
  {k:'namaz',l:'Namaz',e:'🕌'},
  {k:'sunnah',l:'Sunnah',e:'⭐'},
  {k:'shield',l:'Shield',e:'🛡️'},
  {k:'streaks',l:'Streaks',e:'🔥'},
];

function renderTabBar(){
  const tb=document.getElementById('tabbar');clr(tb);
  TABS.forEach(t=>{
    const b=bt('tab '+(TAB===t.k?'on':''),[sp('tab-i',t.e),sp('tab-l',t.l)],{onclick:()=>{TAB=t.k;renderAll();}});
    tb.appendChild(b);
  });
}

function renderPage(){
  const pg=document.getElementById('page');
  pg.scrollTop=0;clr(pg);
  switch(TAB){
    case'schedule':renderSchedule(pg);break;
    case'duas':renderDuas(pg);break;
    case'dhikr':renderDhikr(pg);break;
    case'namaz':renderNamaz(pg);break;
    case'sunnah':renderSunnah(pg);break;
    case'shield':renderShield(pg);break;
    case'streaks':renderStreaks(pg);break;
  }
  if(SCROLL[TAB])setTimeout(()=>{pg.scrollTop=SCROLL[TAB];},30);
  pg.addEventListener('scroll',()=>{SCROLL[TAB]=pg.scrollTop;},{passive:true});
}

function renderAll(){renderTabBar();renderPage();}
window.addEventListener('DOMContentLoaded',renderAll);
</script>
</body>
